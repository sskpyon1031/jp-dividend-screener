name: update-screener

on:
  schedule:
    # 平日 1日2回。cron は UTC 指定（JST = UTC + 9）。
    # 03:15 UTC = 12:15 JST（前場 11:30 終了後の昼スナップショット）
    - cron: "15 3 * * 1-5"
    # 08:00 UTC = 17:00 JST（東証の大引け後）
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-screener
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # git pull --rebase を安全に行うため全履歴を取得

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch & screen
        run: python scripts/fetch.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "data: auto update $(date -u +%Y-%m-%dT%H:%MZ)"
            # 実行中に手動 push があっても衝突しないよう rebase してから push
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
